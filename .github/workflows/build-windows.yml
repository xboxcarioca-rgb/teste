# Compila o instalador .exe do Viral Cut Studio no Windows.
#
# O desenvolvimento pode acontecer em qualquer SO, mas o binário final precisa
# ser montado no Windows (electron-builder gera NSIS/portable nativos lá, sem
# Wine). Por isso este workflow roda em windows-latest.
#
# Disparos:
#   • push em qualquer branch  -> valida (lint + testes) e produz o instalador
#                                 como artefato de execução (retention 30 dias);
#   • push de tag v*           -> além do artefato, publica um GitHub Release;
#   • workflow_dispatch        -> build manual pelo botão "Run workflow".

name: Build Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# Evita duas execuções paralelas na mesma branch (economiza minutos de CI).
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # necessário apenas para criar o Release em tags v*

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm ci garante lockfile fiel ao repositório; o FFmpeg/FFprobe vêm por
        # npm (@ffmpeg-installer/win32-x64), então não há download externo aqui.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Package pre-checks
        run: node scripts/verify-package.js

      - name: Build installer (NSIS + portable)
        run: npx electron-builder --win nsis portable --x64

      - name: Verify built package
        run: node scripts/verify-package.js --strict

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: viral-cut-studio-windows
          path: |
            dist/*Setup*.exe
            dist/*Portable*.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*Setup*.exe
            dist/*Portable*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
