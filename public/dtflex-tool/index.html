<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>DTFLEXPRO Halftone Engine</title>
    <style>
      @media print {
        html, body { display: none !important; visibility: hidden !important; background: #000 !important; }
      }
      html, body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      input, textarea { -webkit-user-select: text; user-select: text; }
    </style>
    <script>
      // Proteção anti-print dentro do iframe da ferramenta
      (function () {
        document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        document.addEventListener('keydown', function (e) {
          var k = e.key;
          if (k === 'PrintScreen') {
            try { navigator.clipboard.writeText(''); } catch (_) {}
            e.preventDefault();
            alert('Captura de tela bloqueada nesta ferramenta.');
            return;
          }
          if ((e.ctrlKey || e.metaKey) && (k === 'p' || k === 'P' || k === 's' || k === 'S')) {
            e.preventDefault();
            return;
          }
          if (k === 'F12' || ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','I','j','J','c','C'].indexOf(k) !== -1)) {
            e.preventDefault();
          }
        }, true);
        window.addEventListener('beforeprint', function () { document.body.style.visibility = 'hidden'; });
        window.addEventListener('afterprint', function () { document.body.style.visibility = ''; });



      })();
    </script>
    <script>
      // ====== Patch PNG export: final file is always verified at real 300 DPI (pHYs) ======
      (function () {
        var DPI = 300;
        var PPM_300 = 11811;
        function mmToPx(mm){ return Math.round(mm / 25.4 * DPI); }
        var PAPER_FORMATS = {
          A2: { widthMm: 420, heightMm: 594 },
          A3: { widthMm: 297, heightMm: 420 },
          A4: { widthMm: 210, heightMm: 297 }
        };
        Object.keys(PAPER_FORMATS).forEach(function(key){
          PAPER_FORMATS[key].widthPx = mmToPx(PAPER_FORMATS[key].widthMm);
          PAPER_FORMATS[key].heightPx = mmToPx(PAPER_FORMATS[key].heightMm);
        });
        var A4_WIDTH = PAPER_FORMATS.A4.widthPx;
        var A4_HEIGHT = PAPER_FORMATS.A4.heightPx;
        var A3_WIDTH = PAPER_FORMATS.A3.widthPx;
        var A3_HEIGHT = PAPER_FORMATS.A3.heightPx;
        var A2_WIDTH = PAPER_FORMATS.A2.widthPx;
        var A2_HEIGHT = PAPER_FORMATS.A2.heightPx;
        var PNG_SIG = new Uint8Array([137,80,78,71,13,10,26,10]);

        try {
          if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (regs) { regs.forEach(function (reg) { reg.unregister(); }); });
          if ('caches' in window) caches.keys().then(function (keys) { keys.forEach(function (key) { caches.delete(key); }); });
        } catch (_) {}

        var CRC_TABLE = (function(){
          var t = new Uint32Array(256);
          for (var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xedb88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}
          return t;
        })();
        function crc32(b){var c=0xffffffff;for(var i=0;i<b.length;i++)c=CRC_TABLE[(c^b[i])&0xff]^(c>>>8);return (c^0xffffffff)>>>0;}
        function isPng(buf){ if (!buf || buf.length < 33) return false; for (var i=0;i<8;i++) if (buf[i]!==PNG_SIG[i]) return false; return true; }
        function chunkType(buf, off){ return String.fromCharCode(buf[off+4],buf[off+5],buf[off+6],buf[off+7]); }
        function concat(parts){ var total=0; for (var i=0;i<parts.length;i++) total+=parts[i].length; var out=new Uint8Array(total), cur=0; for (var j=0;j<parts.length;j++){ out.set(parts[j], cur); cur+=parts[j].length; } return out; }
        function buildPhys(){
          var data = new Uint8Array(9);
          var dv = new DataView(data.buffer);
          dv.setUint32(0, PPM_300, false);
          dv.setUint32(4, PPM_300, false);
          data[8]=1;
          var type = new Uint8Array([0x70,0x48,0x59,0x73]);
          var body = new Uint8Array(4+9);
          body.set(type,0); body.set(data,4);
          var out = new Uint8Array(4+4+9+4);
          var od = new DataView(out.buffer);
          od.setUint32(0,9,false);
          out.set(type,4); out.set(data,8);
          od.setUint32(17, crc32(body), false);
          return out;
        }
        function readPhys(buf){
          if (!isPng(buf)) return null;
          var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
          var off=8;
          while (off + 12 <= buf.length){
            var len = dv.getUint32(off,false);
            var end = off+8+len+4;
            if (end > buf.length) return null;
            var t = chunkType(buf, off);
            if (t==='pHYs' && len===9) {
              return { x: dv.getUint32(off+8,false), y: dv.getUint32(off+12,false), unit: buf[off+16] };
            }
            if (t==='IEND') break;
            off=end;
          }
          return null;
        }
        function setDpi(buf){
          if (!isPng(buf)) return buf;
          var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
          var parts = [buf.subarray(0,8)];
          var phys = buildPhys();
          var inserted = false;
          var off=8;
          while (off + 12 <= buf.length){
            var len = dv.getUint32(off,false);
            var end = off+8+len+4;
            if (end > buf.length) return buf;
            var t = chunkType(buf, off);
            if (t !== 'pHYs') parts.push(buf.subarray(off,end));
            if (t === 'IHDR' && !inserted) { parts.push(phys); inserted = true; }
            off=end;
            if (t==='IEND') break;
          }
          if (!inserted) parts.splice(1,0,phys);
          return concat(parts);
        }
        function ensureDpi(buf){
          var fixed = setDpi(buf);
          var meta = readPhys(fixed);
          if (!meta || meta.x !== PPM_300 || meta.y !== PPM_300 || meta.unit !== 1) fixed = setDpi(fixed);
          meta = readPhys(fixed);
          window.__DTF_LAST_DPI_CHECK = meta;
          try { console.log('[DPI300] verificado pHYs=', meta && meta.x, meta && meta.y, 'unit=', meta && meta.unit); } catch(_){}
          return fixed;
        }
        function bytesToBase64(bytes){
          var binary = '';
          var chunk = 0x8000;
          for (var i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
          return btoa(binary);
        }
        function dataUrlToBytes(url){
          var comma = url.indexOf(',');
          var bin = atob(url.substring(comma+1));
          var buf = new Uint8Array(bin.length);
          for (var i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
          return buf;
        }
        function fixDataUrl(url){
          if (typeof url !== 'string' || url.indexOf('data:image/png') !== 0) return url;
          try { return 'data:image/png;base64,' + bytesToBase64(ensureDpi(dataUrlToBytes(url))); }
          catch(e){ console.warn('[DPI300] falha ao regravar data URL', e); return url; }
        }
        // Bounding box dos pixels não-transparentes do canvas de origem
        function getContentBBox(source){
          try {
            var sctx = source.getContext && source.getContext('2d');
            if (!sctx) return null;
            var W = source.width, H = source.height;
            var img = sctx.getImageData(0, 0, W, H).data;
            var minX = W, minY = H, maxX = -1, maxY = -1;
            for (var y = 0; y < H; y++) {
              for (var x = 0; x < W; x++) {
                if (img[(y * W + x) * 4 + 3] > 0) {
                  if (x < minX) minX = x;
                  if (x > maxX) maxX = x;
                  if (y < minY) minY = y;
                  if (y > maxY) maxY = y;
                }
              }
            }
            if (maxX < 0) return null;
            return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
          } catch (e) { return null; }
        }
        // Configuração de margem de segurança (acessível via UI)
        window.__DTF_EXPORT_MARGIN = window.__DTF_EXPORT_MARGIN || { mode: 'auto', value: 8 };
        function computePaddingPx(bbox){
          var cfg = window.__DTF_EXPORT_MARGIN || { mode: 'auto', value: 8 };
          var base = Math.max(bbox.w, bbox.h);
          if (cfg.mode === 'mm') {
            // 300 DPI → 1 mm = 300/25.4 px
            return Math.round((Number(cfg.value) || 0) * 300 / 25.4);
          }
          if (cfg.mode === 'percent') {
            return Math.round(base * (Number(cfg.value) || 0) / 100);
          }
          // auto: 8% do maior lado da arte
          return Math.round(base * 0.08);
        }
        function makeSizedCanvas(source, maxW, maxH){
          var out = document.createElement('canvas');
          var ctx = out.getContext('2d', { alpha: true });
          if (!ctx) return source;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          out.width = maxW;
          out.height = maxH;
          ctx.clearRect(0, 0, maxW, maxH);

          // 1) Bounding box: usa recorte manual se definido; senão detecta automaticamente
          var bbox = null;
          if (window.__DTF_MANUAL_BBOX) {
            var m = window.__DTF_MANUAL_BBOX;
            bbox = { x: Math.max(0, m.x|0), y: Math.max(0, m.y|0),
                     w: Math.min(source.width - (m.x|0), m.w|0),
                     h: Math.min(source.height - (m.y|0), m.h|0) };
            window.__DTF_MANUAL_BBOX = null;
          }
          // Sem recorte manual: usa a IMAGEM INTEIRA. Nunca apaga bordas/cantos.
          if (!bbox || bbox.w <= 0 || bbox.h <= 0) bbox = { x: 0, y: 0, w: source.width, h: source.height };

          // 2) Adicionar margem de segurança ao redor (0 quando o recorte foi manual)
          var pad = window.__DTF_SKIP_PADDING ? 0 : computePaddingPx(bbox);
          window.__DTF_SKIP_PADDING = false;
          var paddedW = bbox.w + pad * 2;
          var paddedH = bbox.h + pad * 2;

          // 3) Ajustar à folha mantendo proporção, ampliando ou reduzindo sem distorção.
          var scale = Math.min(maxW / paddedW, maxH / paddedH);
          var drawW = Math.round(bbox.w * scale);
          var drawH = Math.round(bbox.h * scale);
          var totalW = Math.round(paddedW * scale);
          var totalH = Math.round(paddedH * scale);

          // 4) Centralizar na folha
          var offX = Math.round((maxW - totalW) / 2 + pad * scale);
          var offY = Math.round((maxH - totalH) / 2 + pad * scale);

          ctx.drawImage(source, bbox.x, bbox.y, bbox.w, bbox.h, offX, offY, drawW, drawH);
          return out;
        }
        function paperDimensions(format){
          var spec = PAPER_FORMATS[format];
          if (!spec) return null;
          var landscape = window.__DTF_EXPORT_ORIENTATION === 'landscape';
          return {
            width: landscape ? spec.heightPx : spec.widthPx,
            height: landscape ? spec.widthPx : spec.heightPx,
            widthMm: landscape ? spec.heightMm : spec.widthMm,
            heightMm: landscape ? spec.widthMm : spec.heightMm
          };
        }
        function visibleBounds(canvas){
          try {
            var ctx = canvas.getContext('2d', { willReadFrequently: true });
            var data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            var x0 = canvas.width, y0 = canvas.height, x1 = -1, y1 = -1;
            for (var y = 0; y < canvas.height; y++) for (var x = 0; x < canvas.width; x++) {
              if (data[(y * canvas.width + x) * 4 + 3] === 0) continue;
              if (x < x0) x0 = x; if (x > x1) x1 = x;
              if (y < y0) y0 = y; if (y > y1) y1 = y;
            }
            return x1 < 0 ? null : { x:x0, y:y0, w:x1-x0+1, h:y1-y0+1 };
          } catch (e) { return null; }
        }
        function makePaperCanvas(source, format){
          var dims = paperDimensions(format);
          if (!dims) return source;
          var out;
          // O upload já contém EXATAMENTE o enquadramento confirmado (inclusive
          // zoom e posição). Reprojetar a folha inteira, jamais detectar outro
          // bounding box aqui: isso apagaria texto, detalhes afastados e o
          // ajuste feito pela pessoa.
          var uploaded = window.__DTF_ORIGINAL_CANVAS;
          if (uploaded && uploaded.width && uploaded.height && window.__DTF_UPLOAD_PAPER === format) {
            out = document.createElement('canvas');
            out.width = dims.width; out.height = dims.height;
            var dest = out.getContext('2d', { alpha: true });
            dest.imageSmoothingEnabled = true;
            dest.imageSmoothingQuality = 'high';
            // O canvas inteiro representa a folha escolhida. Copiá-lo inteiro
            // conserva cada coordenada confirmada, mesmo quando a retícula deixa
            // texto claro ou elementos separados com poucos pixels visíveis.
            dest.drawImage(source, 0, 0, source.width, source.height, 0, 0, dims.width, dims.height);
          }
          if (out) {
            // Já está no tamanho e no enquadramento escolhidos no upload.
          } else if (source.width === dims.width && source.height === dims.height) {
            out = document.createElement('canvas');
            out.width = dims.width; out.height = dims.height;
            out.getContext('2d', { alpha: true }).drawImage(source, 0, 0);
          } else {
            out = makeSizedCanvas(source, dims.width, dims.height);
          }
          var valid = out.width === dims.width && out.height === dims.height;
          window.__DTF_LAST_EXPORT_VALIDATION = { format: format, orientation: window.__DTF_EXPORT_ORIENTATION || 'portrait', width: out.width, height: out.height, dpi: DPI, valid: valid };
          if (!valid) throw new Error('Dimensão final inválida para ' + format + '.');
          return out;
        }
        function makeA4Canvas(source){ return makePaperCanvas(source, 'A4'); }
        function makeA3Canvas(source){ return makePaperCanvas(source, 'A3'); }
        function makeA2Canvas(source){ return makePaperCanvas(source, 'A2'); }

        function normalizeDownloadName(name){
          var finalName = name || 'DTFlexPro_300dpi.png';
          var tag = null;
          if (window.__DTF_PENDING_A4_DOWNLOAD) { tag = '_A4'; window.__DTF_PENDING_A4_DOWNLOAD = false; }
          else if (window.__DTF_PENDING_A3_DOWNLOAD) { tag = '_A3'; window.__DTF_PENDING_A3_DOWNLOAD = false; }
          else if (window.__DTF_PENDING_A2_DOWNLOAD) { tag = '_A2'; window.__DTF_PENDING_A2_DOWNLOAD = false; }
          if (tag) {
            finalName = finalName.replace(/\.png$/i, '');
            if (finalName.indexOf(tag) === -1) finalName += tag;
            if (finalName.indexOf('300dpi') === -1) finalName += '_300dpi';
            finalName += '.png';
          }
          return finalName;
        }
        // Pergunta o nome do arquivo antes de salvar (Salvar como...)
        function askFileName(suggested){
          var base = suggested || 'DTFlexPro_300dpi.png';
          try {
            var ans = window.prompt('Salvar como — nome do arquivo:', base);
            if (ans === null) return null; // cancelou
            ans = String(ans).trim();
            if (!ans) ans = base;
            if (!/\.png$/i.test(ans)) ans += '.png';
            return ans.replace(/[\\/:*?"<>|]/g, '-');
          } catch (e) { return base; }
        }
        function fixAnchorSync(a){
          var name = askFileName(normalizeDownloadName(a.download));
          if (name === null) return false;
          a.href = fixDataUrl(a.href);
          a.download = name;
          a.setAttribute('data-dpi-fixed', 'true');
          return true;
        }
        var origAnchorClick = HTMLAnchorElement.prototype.click;
        async function forceFixedPngDownload(a){
          var name = askFileName(normalizeDownloadName(a.download));
          if (name === null) return;
          try {
            var res = await fetch(a.href, { cache: 'no-store' });
            var fixed = ensureDpi(new Uint8Array(await res.arrayBuffer()));
            var url = URL.createObjectURL(new Blob([fixed], { type: 'image/png' }));
            var dl = document.createElement('a');
            dl.href = url;
            dl.download = name;
            dl.setAttribute('data-dpi-fixed', 'true');
            document.body.appendChild(dl);
            origAnchorClick.call(dl);
            setTimeout(function(){ URL.revokeObjectURL(url); dl.remove(); }, 1500);
          } catch(e) {
            a.href = fixDataUrl(a.href);
            a.download = name;
            a.setAttribute('data-dpi-fixed', 'true');
            origAnchorClick.call(a);
          }
        }
        async function rewriteBlob(blob){
          try {
            if (!blob || blob.type !== 'image/png') return blob;
            return new Blob([ensureDpi(new Uint8Array(await blob.arrayBuffer()))], { type: 'image/png' });
          } catch(e){ return blob; }
        }

        var origToBlob = HTMLCanvasElement.prototype.toBlob;
        HTMLCanvasElement.prototype.toBlob = function(cb, type, q){
          var source = this;
          if ((!type || type === 'image/png') && window.__flat && source === window.__flat) {
            source = compositeTextOverlay(source);
            if (window.__DTF_EXPORT_A4_NEXT) {
              source = makeA4Canvas(source);
              window.__DTF_EXPORT_A4_NEXT = false;
              window.__DTF_PENDING_A4_DOWNLOAD = true;
            } else if (window.__DTF_EXPORT_A3_NEXT) {
              source = makeA3Canvas(source);
              window.__DTF_EXPORT_A3_NEXT = false;
              window.__DTF_PENDING_A3_DOWNLOAD = true;
            } else if (window.__DTF_EXPORT_A2_NEXT) {
              source = makeA2Canvas(source);
              window.__DTF_EXPORT_A2_NEXT = false;
              window.__DTF_PENDING_A2_DOWNLOAD = true;
            }
          }
          return origToBlob.call(source, function(b){
            if (b && (type==='image/png' || !type)) rewriteBlob(b).then(cb); else cb(b);
          }, type, q);
        };

        var origToDataURL = HTMLCanvasElement.prototype.toDataURL;
        HTMLCanvasElement.prototype.toDataURL = function(type){
          var source = this;
          if ((!type || type === 'image/png') && window.__flat && source === window.__flat) {
            source = compositeTextOverlay(source);
            if (window.__DTF_EXPORT_A4_NEXT) {
              source = makeA4Canvas(source);
              window.__DTF_EXPORT_A4_NEXT = false;
              window.__DTF_PENDING_A4_DOWNLOAD = true;
            } else if (window.__DTF_EXPORT_A3_NEXT) {
              source = makeA3Canvas(source);
              window.__DTF_EXPORT_A3_NEXT = false;
              window.__DTF_PENDING_A3_DOWNLOAD = true;
            } else if (window.__DTF_EXPORT_A2_NEXT) {
              source = makeA2Canvas(source);
              window.__DTF_EXPORT_A2_NEXT = false;
              window.__DTF_PENDING_A2_DOWNLOAD = true;
            }
          }
          var url = origToDataURL.apply(source, arguments);
          if (type && type !== 'image/png') return url;
          return fixDataUrl(url);
        };

        HTMLAnchorElement.prototype.click = function(){
          if (this.download && this.getAttribute('data-dpi-fixed') !== 'true' && typeof this.href === 'string') {
            if (this.href.indexOf('data:image/png') === 0) {
              if (!fixAnchorSync(this)) return;
              return origAnchorClick.apply(this, arguments);
            }
            if (this.href.indexOf('blob:') === 0) {
              forceFixedPngDownload(this);
              return;
            }
          }
          return origAnchorClick.apply(this, arguments);
        };
        document.addEventListener('click', function(e){
          var a = e.target && e.target.closest ? e.target.closest('a[download]') : null;
          if (a && a.getAttribute('data-dpi-fixed') !== 'true' && typeof a.href === 'string') {
            if (a.href.indexOf('data:image/png') === 0) { if (!fixAnchorSync(a)) { e.preventDefault(); e.stopImmediatePropagation(); } return; }
            if (a.href.indexOf('blob:') === 0) { e.preventDefault(); e.stopImmediatePropagation(); forceFixedPngDownload(a); }
          }
        }, true);

        function openManualCropModal(onConfirm){
          if (!window.__flat) { alert('Gere a arte primeiro.'); return; }
          var src = window.__flat;
          var overlay = document.createElement('div');
          overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;';
          overlay.innerHTML = ''
            + '<div style="color:#fff;font:600 14px system-ui;text-align:center;max-width:640px;">Arraste para selecionar a área de corte / redimensionar. Use os presets de proporção para enquadrar. Confirme para baixar.</div>'
            + '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font:600 12px system-ui;color:#fff;align-items:center;">'
            + '  <span style="opacity:.85;">Proporção:</span>'
            + '  <button data-ar="free" class="dtf-ar" style="padding:6px 10px;border-radius:6px;border:1px solid #888;background:#0ea5e9;color:#fff;font-weight:700;cursor:pointer;">Livre</button>'
            + '  <button data-ar="1:1"  class="dtf-ar" style="padding:6px 10px;border-radius:6px;border:1px solid #888;background:#222;color:#fff;font-weight:600;cursor:pointer;">1:1</button>'
            + '  <button data-ar="3:4"  class="dtf-ar" style="padding:6px 10px;border-radius:6px;border:1px solid #888;background:#222;color:#fff;font-weight:600;cursor:pointer;">3:4</button>'
            + '  <button data-ar="4:3"  class="dtf-ar" style="padding:6px 10px;border-radius:6px;border:1px solid #888;background:#222;color:#fff;font-weight:600;cursor:pointer;">4:3</button>'
            + '  <button data-ar="A4"   class="dtf-ar" style="padding:6px 10px;border-radius:6px;border:1px solid #888;background:#222;color:#fff;font-weight:600;cursor:pointer;">A4</button>'
            + '  <button data-ar="A3"   class="dtf-ar" style="padding:6px 10px;border-radius:6px;border:1px solid #888;background:#222;color:#fff;font-weight:600;cursor:pointer;">A3</button>'
            + '  <button data-ar="A2"   class="dtf-ar" style="padding:6px 10px;border-radius:6px;border:1px solid #888;background:#222;color:#fff;font-weight:600;cursor:pointer;">A2</button>'
            + '</div>'
            + '<div id="dtf-crop-stage" style="position:relative;background:#222;border:1px solid #444;max-width:90vw;max-height:60vh;overflow:hidden;"></div>'
            + '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">'
            + '  <button id="dtf-crop-reset" style="padding:8px 14px;border-radius:8px;border:1px solid #888;background:#222;color:#fff;font-weight:600;cursor:pointer;">Selecionar tudo</button>'
            + '  <button id="dtf-crop-cancel" style="padding:8px 14px;border-radius:8px;border:1px solid #888;background:#222;color:#fff;font-weight:600;cursor:pointer;">Cancelar</button>'
            + '  <button id="dtf-crop-ok" style="padding:8px 14px;border-radius:8px;border:0;background:#22c55e;color:#062;font-weight:700;cursor:pointer;">Confirmar e baixar</button>'
            + '</div>';
          document.body.appendChild(overlay);

          var stage = overlay.querySelector('#dtf-crop-stage');
          var maxW = Math.min(window.innerWidth * 0.9, 1100);
          var maxH = Math.min(window.innerHeight * 0.7, 720);

        function renderBenDay(src){
          if (!src || !src.width) return src;

          var half = step / 2;
          for (var v = -diag; v <= diag; v += step) {
            for (var u = -diag; u <= diag; u += step) {
              var cx = u * ca - v * sa + W / 2;
              var cy = u * sa + v * ca + H / 2;
              if (cx < -step || cy < -step || cx > W + step || cy > H + step) continue;

        }
