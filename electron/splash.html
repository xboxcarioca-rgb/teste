<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>DTFLEXPRO Studio</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070c;
        overflow: hidden;
      }
      .wrap {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 30%;
        background: linear-gradient(90deg, #0ea5e9, #38bdf8);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="./assets/cover.jpg" alt="DTFLEXPRO" />
      <div class="bar"><i></i></div>
    </div>
  </body>
</html>
